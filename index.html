<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="description" content="Доминигеймс">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Доминигеймс">
  <meta property="og:image" content="images/ogimage.png">
  <meta name="theme-color" content="#434343">
  <title>Доминигеймс | Казуальные игры</title>
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
  <link rel="shortcut icon" href="images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&display=swap">
  <style>
    :root {
      --dark-color: #303030;
      --main-color: #000000;
      --main-color-transparent: #00000026;
      --mockup-color: rgba(255, 255, 255, 0.3);
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      border: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: 'Ubuntu', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: #000;
      color: #fff;
      min-width: 320px;
      position: relative;
      min-height: 100vh;
      overflow: hidden;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* ===== Header ===== */
    .header {
      width: 100%;
      min-width: 320px;
      padding: 30px 40px;
      position: relative;
    }

    .header__container {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0 15px;
      max-width: 100%;
      width: 100%;
      position: relative;
    }

    .header__logo {
      display: flex;
      align-items: center;
      margin-right: initial;
    }

    .header__logo-image {
      max-width: 100%;
      max-height: 160px;
    }

    @media (max-width: 420px) {
      .header { padding: 30px 10px; }
    }

    @media (min-width: 420px) {
      .header { padding: 30px 0 50px; }
      .header__container { padding: 0 30px; }
    }

    @media (min-width: 768px) {
      .header {
        flex: 0 0 auto;
        margin: 0 auto;
        padding: 30px 0 10px;
        max-width: 768px;
      }
    }

    @media (min-width: 1024px) { .header { max-width: 1024px; } }
    @media (min-width: 1380px) { .header { max-width: 1380px; } }
    @media (min-width: 1680px) { .header { max-width: 1680px; } }
    @media (min-width: 2560px) { .header { max-width: 2560px; padding-top: 60px; } }

    /* ===== Main ===== */
    .main {
      margin-top: auto;
      overflow: hidden;
      flex: 1;
    }

    .main__wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      margin: auto auto 0;
      text-align: center;
      position: relative;
      width: 100%;
      min-width: 320px;
      max-width: 1280px;
      padding: 0 15px;
    }

    .main__content {
      margin: 0 auto 50px;
      width: 100%;
      padding: 0;
      position: relative;
    }

    .main__heading {
      margin-bottom: 15px;
      width: 100%;
    }

    .main__heading-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 15px;
    }

    .main__logo {
      height: 96px;
      width: auto;
      flex-shrink: 0;
    }

    .main__title {
      font-size: 29px;
      line-height: 35px;
      font-weight: 500;
      margin: 0;
      text-align: center;
    }

    .main__subtitle {
      font-size: 16px;
      font-weight: 400;
      margin: 0;
      line-height: 25px;
      text-align: center;
      letter-spacing: -0.3px;
      padding-right: 0;
    }

    @media (min-width: 420px) {
      .main__heading { margin-bottom: 25px; }
      .main__title { font-size: 35px; line-height: 40px; }
      .main__heading-row { margin-bottom: 20px; }
      .main__subtitle { letter-spacing: 0.3px; }
      .main__wrapper { padding: 0 25px; }
    }

    @media (min-width: 768px) {
      .main { overflow: visible; }
      .main__wrapper {
        margin: 0 auto;
        flex: 1 1 auto;
        min-height: 323px;
        max-width: 768px;
        flex-direction: row;
        justify-content: space-between;
        padding: 0 30px;
      }
      .main__content {
        margin: 0;
        width: 50%;
        padding-right: 20px;
      }
      .main__heading { width: 100%; }
      .main__subtitle {
        letter-spacing: 0.2px;
        padding: 0;
        margin: 0 0 50px;
      }
    }

    @media (min-width: 1024px) { .main__wrapper { max-width: 1024px; } }
    @media (min-width: 1380px) {
      .main__wrapper { max-width: 1380px; }
      .main__title { font-size: 45px; line-height: 50px; }
      .main__heading-row { margin-bottom: 25px; }
      .main__logo { height: 130px; }
      .main__subtitle { font-size: 20px; line-height: 30px; padding-right: 50px; }
    }
    @media (min-width: 1680px) {
      .main__wrapper { max-width: 1680px; }
      .main__title { font-size: 60px; line-height: 60px; }
      .main__heading-row { margin-bottom: 30px; }
      .main__logo { height: 150px; }
      .main__subtitle { font-size: 25px; line-height: 35px; padding-right: 120px; margin: 0 0 65px; }
    }
    @media (min-width: 2560px) {
      .main__wrapper { max-width: 2560px; }
      .main__title { font-size: 90px; line-height: 1.06; margin: 0 0 40px; }
      .main__subtitle { font-size: 40px; line-height: 1.38; }
      .main__heading { margin-bottom: 50px; }
    }

    /* ===== Footer ===== */
    .footer {
      width: 100%;
      min-width: 320px;
      margin-top: auto;
    }

    .footer__container {
      display: flex;
      flex-direction: row;
      gap: 48px;
      padding: 24px 30px 32px;
      justify-content: center;
      align-items: flex-start;
    }

    .footer__col {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .footer__line {
      display: block;
      font-size: 12px;
      font-weight: 400;
      line-height: 1.9;
      color: #fff;
      opacity: 0.38;
      transition: opacity 0.2s;
    }

    a.footer__line:hover { opacity: 0.7; }

    #email-span a {
      color: #fff;
      font-size: 12px;
      font-weight: 400;
      line-height: 1.9;
      opacity: 0.38;
      transition: opacity 0.2s;
      display: block;
    }
    #email-span a:hover { opacity: 0.7; }

    @media (min-width: 768px) {
      .footer { max-width: 768px; margin: 0 auto; flex: 0 0 auto; }
    }
    @media (min-width: 1024px) { .footer { max-width: 1024px; } }
    @media (min-width: 1380px) { .footer { max-width: 1380px; } }
    @media (min-width: 1680px) { .footer { max-width: 1680px; } }
    @media (min-width: 2560px) { .footer { max-width: 2560px; } }

    @media (max-width: 480px) {
      .footer__container { gap: 32px; padding: 20px 20px 28px; }
    }

    /* ===== Center layout overrides ===== */
    .main--center-layout .main__wrapper {
      flex-direction: column;
      padding-top: 40px;
    }
    .main--center-layout .main__content {
      width: 100%;
      padding-right: 0;
      margin: 0 auto 50px;
    }
    .main--center-layout .main__heading {
      width: 100%;
    }
    .main--center-layout .main__title {
      text-align: center;
    }
    .main--center-layout .main__subtitle {
      text-align: center;
      padding-right: 0 !important;
      margin: 0 !important;
    }

    /* ===== Animations ===== */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .main__content {
      animation: fadeInUp 1s ease-out;
    }

    .footer {
      animation: fadeInUp 1s ease-out 0.3s both;
    }

    /* ===== Carousel ===== */
    .carousel {
      width: 100%;
      overflow: hidden;
      padding: 32px 0 40px;
      -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 8%, #000 92%, transparent 100%);
      mask-image: linear-gradient(to right, transparent 0%, #000 8%, #000 92%, transparent 100%);
      animation: fadeInUp 1s ease-out 0.15s both;
    }

    .carousel__track {
      display: flex;
      gap: 14px;
      width: max-content;
      animation: carousel-scroll 38s linear infinite;
    }

    .carousel__icon {
      width: 88px;
      height: 88px;
      border-radius: 20px;
      object-fit: cover;
      flex-shrink: 0;
      display: block;
      pointer-events: none;
      user-select: none;
    }

    @keyframes carousel-scroll {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }

    @media (max-width: 480px) {
      .carousel__icon { width: 72px; height: 72px; border-radius: 16px; }
      .carousel__track { gap: 12px; }
    }
  </style>
